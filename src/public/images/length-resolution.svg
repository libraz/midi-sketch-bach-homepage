<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 358" width="960" height="358" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">How the output length is resolved</title>
  <desc id="dsc">A chain of four values. The form's natural length is multiplied by the scale to give a raw target, that target is snapped to the form's own bar grid, and the snapped value is clamped to the range between the form's minimum and 128. A targetBars value of zero uses scale; a positive value overrides scale and enters at the raw-target stage, then passes through snapping and clamping. Goldberg full when no positive targetBars is supplied is a special complete 128-bar layout rather than a literal four times its 20-bar natural length. Below, three worked examples for the fugue.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="358" rx="12"/>

  <rect class="card" x="40" y="60" width="190" height="66" rx="6"/>
  <text class="h" x="52" y="82">natural length</text>
  <text class="s" x="52" y="100">the form's own reference</text>
  <text class="s" x="52" y="112">bar count — 42 for a fugue</text>

  <text class="s" x="250" y="86" text-anchor="middle">× scale</text>
  <path class="ln" d="M 230 93 H 270" marker-end="url(#a)"/>

  <rect class="card" x="270" y="60" width="190" height="66" rx="6"/>
  <text class="h" x="282" y="82">raw target</text>
  <text class="s" x="282" y="100">short ≈1x, medium ≈2x,</text>
  <text class="s" x="282" y="112">long ≈3x, full ≈4x*</text>

  <text class="s" x="480" y="86" text-anchor="middle">snap</text>
  <path class="ln" d="M 460 93 H 500" marker-end="url(#a)"/>

  <rect class="card" x="500" y="60" width="190" height="66" rx="6"/>
  <text class="h" x="512" y="82">snapped</text>
  <text class="s" x="512" y="100">rounded to the form's own</text>
  <text class="s" x="512" y="112">bar grid — its ground period</text>

  <text class="s" x="710" y="86" text-anchor="middle">clamp</text>
  <path class="ln" d="M 690 93 H 730" marker-end="url(#a)"/>

  <rect class="card" x="730" y="60" width="190" height="66" rx="6"/>
  <text class="h" x="742" y="82">output bars</text>
  <text class="s" x="742" y="100">held inside [form minimum,</text>
  <text class="s" x="742" y="112">128]; no form goes past 128</text>

  <path class="ln" d="M 365 150 V 128" marker-end="url(#a)"/>
  <rect class="chip" x="270" y="152" width="190" height="44" rx="6"/>
  <text class="mono" x="282" y="170">targetBars</text>
  <text class="s" x="282" y="188">positive wins; zero uses scale</text>

  <rect class="grp" x="24" y="206" width="912" height="100" rx="8"/>
  <text class="lbl" x="38" y="226">worked through, for the fugue</text>
  <text class="s" x="230" y="226">natural length 42 bars, grid step 4 · * Goldberg full with no positive targetBars resolves to 128 bars</text>
  <text class="lbl" x="40" y="248">request</text>
  <text class="lbl" x="250" y="248">raw</text>
  <text class="lbl" x="420" y="248">snapped</text>
  <text class="lbl" x="540" y="248">output</text>
  <text class="mono" x="40" y="266">scale: 'short'</text>
  <text class="mono" x="250" y="266">42 × 1 = 42</text>
  <text class="mono" x="420" y="266">44</text>
  <text class="mono" x="540" y="266">44</text>
  <text class="mono" x="40" y="282">scale: 'long'</text>
  <text class="mono" x="250" y="282">42 × 3 = 126</text>
  <text class="mono" x="420" y="282">128</text>
  <text class="mono" x="540" y="282">128</text>
  <text class="mono" x="40" y="298">targetBars: 48</text>
  <text class="mono" x="250" y="298">48</text>
  <text class="mono" x="420" y="298">48</text>
  <text class="mono" x="540" y="298">48</text>

  <path class="seam" d="M 24 322 H 936"/>
  <text class="s" x="480" y="342" text-anchor="middle">Except for Goldberg full, both routes finish through the same snap and clamp, which is why targetBars is a request for a length rather than a guarantee of one.</text>
</svg>
