<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">どこで何が動くか</title>
  <desc id="dsc">3 層のスタックです。最上段はアプリケーションが呼ぶ JavaScript API、中段は境界をまたいでメモリを移す Emscripten ブリッジ、最下段は C++ を WebAssembly にコンパイルした作曲エンジンです。形式ディレクター、候補探索、生成検証から装飾パス・FinalScore・形式の対位法予算までの検証段階、表現の準備、書き出しの 5 段が順に並びます。表現の準備では、強弱、記譜上の音符のスナップショット、アーティキュレーション、トラックの再レンダリング、楽器の割り当て、CC とテンポイベントをこの順で処理します。上位層へ呼び返す経路はありません。</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
    <marker id="b" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah2" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="350" rx="12"/>

  <rect class="grp" x="24" y="40" width="912" height="62" rx="8"/>
  <text class="lbl" x="38" y="59">JavaScript API</text>
  <rect class="chip" x="38" y="68" width="68" height="26" rx="5"/>
  <text class="mono" x="72" y="85" text-anchor="middle">init()</text>
  <rect class="chip" x="116" y="68" width="112" height="26" rx="5"/>
  <text class="mono" x="172" y="85" text-anchor="middle">BachGenerator</text>
  <rect class="chip" x="238" y="68" width="112" height="26" rx="5"/>
  <text class="s" x="294" y="85" text-anchor="middle">プリセットと列挙</text>
  <text class="s" x="922" y="85" text-anchor="end">アプリが触れるのはこの層だけ</text>

  <path class="ln" d="M 480 102 V 116" marker-end="url(#a)"/>

  <rect class="grp" x="24" y="118" width="912" height="44" rx="8"/>
  <text class="lbl" x="38" y="144">Emscripten ブリッジ</text>
  <text class="s" x="180" y="144">WASM メモリの確保と解放。MIDI バイト列と直列化イベントを JavaScript 側へコピーする</text>

  <path class="ln" d="M 480 162 V 176" marker-end="url(#a)"/>

  <rect class="grp" x="24" y="178" width="912" height="118" rx="8"/>
  <text class="lbl" x="38" y="198">作曲エンジン</text>
  <text class="s" x="130" y="198">C++ を WebAssembly にコンパイル。JavaScript を呼び返さない、決定的な 1 パス</text>

  <rect class="card" x="39" y="212" width="165" height="70" rx="6"/>
  <text class="h" x="49" y="232">形式ディレクター</text>
  <text class="s" x="49" y="252">小節スパンに声部意図を</text>
  <text class="s" x="49" y="266">割り当てる</text>

  <path class="ln" d="M 204 247 H 218" marker-end="url(#a)"/>

  <rect class="card" x="218" y="212" width="165" height="70" rx="6"/>
  <text class="h" x="228" y="232">候補探索</text>
  <text class="s" x="228" y="252">既定では担体をそのまま</text>
  <text class="s" x="228" y="266">再生。採点探索は任意</text>

  <path class="ln" d="M 383 247 H 397" marker-end="url(#a)"/>

  <rect class="card" x="397" y="212" width="165" height="70" rx="6"/>
  <text class="h" x="407" y="232">装飾と最終検証</text>
  <text class="s" x="407" y="248">生成検証 → 装飾 →</text>
  <text class="s" x="407" y="260">FinalScore → 形式予算</text>

  <path class="ln" d="M 562 247 H 576" marker-end="url(#a)"/>

  <rect class="card" x="576" y="212" width="165" height="70" rx="6"/>
  <text class="h" x="586" y="232">表現と楽器</text>
  <text class="s" x="586" y="248">ノート長調整</text>
  <text class="s" x="586" y="260">トラック化・音色</text>
  <text class="s" x="586" y="272">CC・テンポ</text>

  <path class="ln" d="M 741 247 H 755" marker-end="url(#a)"/>

  <rect class="card" x="755" y="212" width="165" height="70" rx="6"/>
  <text class="h" x="765" y="232">書き出し</text>
  <text class="s" x="765" y="252">標準 MIDI ファイルと</text>
  <text class="s" x="765" y="266">公開イベントデータ</text>

  <path class="seam" d="M 24 312 H 936"/>
  <text class="s" x="480" y="332" text-anchor="middle">スタックを遡る経路はない。エンジンは一度だけ走ってバイト列を返す — コールバックもファイル I/O も音声レンダリングもない。</text>
</svg>
