<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 396" width="960" height="396" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">The four layout families</title>
  <desc id="dsc">Four rows, each showing one layout family as three voice lanes across the bars of a piece. Fugal layouts stagger theme entries and put episodes between them. Ground-bass layouts repeat one frozen bass under upper voices that are rewritten each cycle. Cantus firmus layouts hold long fixed tones in the middle with busy figuration above and an independent bass below. Linear layouts trade material between two upper voices over a continuously running line.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <rect class="bg" x="0" y="0" width="960" height="396" rx="12"/>

  <rect class="card" x="24" y="20" width="22" height="12" rx="3"/>
  <text class="s" x="52" y="30">theme entry or variation material</text>
  <rect class="fill1" x="250" y="20" width="22" height="12" rx="3"/>
  <text class="s" x="278" y="30">a line the form freezes</text>
  <rect class="alt" x="425" y="20" width="22" height="12" rx="3"/>
  <text class="s" x="453" y="30">episode, figuration, free material</text>

  <rect class="grp" x="24" y="46" width="912" height="70" rx="8"/>
  <text class="h" x="38" y="66">Fugal</text>
  <text class="s" x="38" y="82">fugue, prelude_and_fugue,</text>
  <text class="s" x="38" y="94">toccata_and_fugue, fantasia_and_fugue</text>
  <text class="s" x="38" y="108">staggered entries, episodes between them</text>
  <rect class="card" x="316" y="57" width="114" height="13" rx="3"/>
  <rect class="alt"  x="468" y="57" width="76"  height="13" rx="3"/>
  <rect class="card" x="582" y="57" width="114" height="13" rx="3"/>
  <rect class="alt"  x="734" y="57" width="190" height="13" rx="3"/>
  <rect class="card" x="430" y="75" width="114" height="13" rx="3"/>
  <rect class="alt"  x="582" y="75" width="76"  height="13" rx="3"/>
  <rect class="card" x="696" y="75" width="114" height="13" rx="3"/>
  <rect class="alt"  x="848" y="75" width="76"  height="13" rx="3"/>
  <rect class="card" x="544" y="93" width="114" height="13" rx="3"/>
  <rect class="alt"  x="696" y="93" width="76"  height="13" rx="3"/>
  <rect class="card" x="810" y="93" width="114" height="13" rx="3"/>

  <rect class="grp" x="24" y="122" width="912" height="70" rx="8"/>
  <text class="h" x="38" y="142">Ground-bass variation</text>
  <text class="s" x="38" y="158">passacaglia, chaconne,</text>
  <text class="s" x="38" y="170">goldberg_variations</text>
  <text class="s" x="38" y="184">one frozen bass, upper voices rewritten</text>
  <rect class="alt"   x="316" y="133" width="148" height="13" rx="3"/>
  <rect class="card"  x="468" y="133" width="148" height="13" rx="3"/>
  <rect class="card"  x="620" y="133" width="148" height="13" rx="3"/>
  <rect class="alt"   x="772" y="133" width="148" height="13" rx="3"/>
  <rect class="card"  x="468" y="151" width="148" height="13" rx="3"/>
  <rect class="alt"   x="620" y="151" width="148" height="13" rx="3"/>
  <rect class="card"  x="772" y="151" width="148" height="13" rx="3"/>
  <rect class="fill1" x="316" y="169" width="148" height="13" rx="3"/>
  <rect class="fill1" x="468" y="169" width="148" height="13" rx="3"/>
  <rect class="fill1" x="620" y="169" width="148" height="13" rx="3"/>
  <rect class="fill1" x="772" y="169" width="148" height="13" rx="3"/>

  <rect class="grp" x="24" y="198" width="912" height="70" rx="8"/>
  <text class="h" x="38" y="218">Cantus firmus</text>
  <text class="s" x="38" y="234">chorale_prelude</text>
  <text class="s" x="38" y="248">long fixed tones in the middle, with</text>
  <text class="s" x="38" y="260">figuration above and its own bass below</text>
  <rect class="alt"   x="316" y="209" width="196" height="13" rx="3"/>
  <rect class="alt"   x="518" y="209" width="196" height="13" rx="3"/>
  <rect class="alt"   x="720" y="209" width="204" height="13" rx="3"/>
  <rect class="fill1" x="316" y="227" width="140" height="13" rx="3"/>
  <rect class="fill1" x="470" y="227" width="140" height="13" rx="3"/>
  <rect class="fill1" x="624" y="227" width="140" height="13" rx="3"/>
  <rect class="fill1" x="778" y="227" width="146" height="13" rx="3"/>
  <rect class="card"  x="316" y="245" width="120" height="13" rx="3"/>
  <rect class="card"  x="450" y="245" width="100" height="13" rx="3"/>
  <rect class="card"  x="564" y="245" width="140" height="13" rx="3"/>
  <rect class="card"  x="718" y="245" width="90"  height="13" rx="3"/>
  <rect class="card"  x="822" y="245" width="102" height="13" rx="3"/>

  <rect class="grp" x="24" y="274" width="912" height="70" rx="8"/>
  <text class="h" x="38" y="294">Linear / figural</text>
  <text class="s" x="38" y="310">trio_sonata, cello_prelude</text>
  <text class="s" x="38" y="324">two voices trading over a running line;</text>
  <text class="s" x="38" y="336">the cello prelude does it on one voice</text>
  <rect class="card" x="316" y="285" width="152" height="13" rx="3"/>
  <rect class="card" x="620" y="285" width="152" height="13" rx="3"/>
  <rect class="card" x="468" y="303" width="152" height="13" rx="3"/>
  <rect class="card" x="772" y="303" width="152" height="13" rx="3"/>
  <rect class="alt"  x="316" y="321" width="608" height="13" rx="3"/>

  <path class="seam" d="M 24 360 H 936"/>
  <text class="s" x="480" y="380" text-anchor="middle">The form picks the family and the family fixes the shape — which is why the voice count, the meter and the natural length are not options.</text>
</svg>
