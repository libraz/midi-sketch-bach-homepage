<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="960" height="310" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">設計値のアーチ</title>
  <desc id="dsc">曲全体にわたる 1 本の曲線です。提示の区間でゆるやかに上がり、展開の区間でさらに登り、全体のおよそ 8 割の地点で頂点に達し、解決の区間で下がります。曲線の高さは、密度・音域・強弱段階をまとめて表します。アーチは形式に属するので、同じ形式なら常に同じ形になります。</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <defs>
    <marker id="a" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path class="ah" d="M0,0 L9,4.5 L0,9 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="310" rx="12"/>

  <text class="lbl" x="52" y="130" text-anchor="middle" transform="rotate(-90 52 130)">設計値</text>
  <path class="rule" d="M 80 56 V 200 H 900"/>

  <path class="fill1" d="M 80 184 C 190 180 250 166 330 156 C 430 144 560 138 640 118 C 690 106 710 100 736 92 C 780 110 840 142 900 164 L 900 200 L 80 200 Z"/>
  <path class="ln" d="M 80 184 C 190 180 250 166 330 156 C 430 144 560 138 640 118 C 690 106 710 100 736 92 C 780 110 840 142 900 164"/>

  <path class="seam" d="M 736 84 V 200"/>
  <text class="s" x="736" y="76" text-anchor="middle">全体のおよそ 8 割の地点が頂点</text>

  <rect class="chip" x="96" y="64" width="204" height="58" rx="6"/>
  <text class="s" x="108" y="82">密度 — 区間あたりの音数</text>
  <text class="s" x="108" y="98">音域 — 高さの位置</text>
  <text class="s" x="108" y="114">強弱 — MIDI ベロシティ</text>

  <rect class="chip" x="80" y="212" width="238" height="26" rx="5"/>
  <text class="h" x="199" y="229" text-anchor="middle">提示</text>
  <text class="s" x="199" y="252" text-anchor="middle">素材をそのまま示す。薄い</text>
  <text class="s" x="199" y="264" text-anchor="middle">テクスチャと中音域</text>

  <rect class="chip" x="322" y="212" width="410" height="26" rx="5"/>
  <text class="h" x="527" y="229" text-anchor="middle">展開</text>
  <text class="s" x="527" y="252" text-anchor="middle">近親調での主題提示、細かくなるリズム、</text>
  <text class="s" x="527" y="264" text-anchor="middle">広がる音域と上がる強弱段階</text>

  <rect class="chip" x="736" y="212" width="164" height="26" rx="5"/>
  <text class="h" x="818" y="229" text-anchor="middle">解決</text>
  <text class="s" x="818" y="252" text-anchor="middle">張りつめた力が解かれる。</text>
  <text class="s" x="818" y="264" text-anchor="middle">多くの形式は終結を遅くする</text>

  <path class="seam" d="M 24 278 H 936"/>
  <text class="s" x="480" y="298" text-anchor="middle">アーチはシードごとに探索されるものではなく形式の性質。だから出力は、音楽としての形を保ったまま再現できる。</text>
</svg>
