<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 386" width="960" height="386" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Voice intents over bar spans</title>
  <desc id="dsc">The upper half reads a fugue left to right as three voice lanes. Each lane is divided into spans, and every span carries one named intent: subject carrier, answer carrier, countersubject carrier, episode, middle entry, pedal, stretto and coda. The lower half groups the named intents into seven families and says what each family is for.</desc>

  <style>
    .bg    { fill:#f7f5f1 }
    .grp   { fill:#edeae4 }
    .chip  { fill:#ffffff; stroke:#d7d4cd }
    .card  { fill:#ffffff; stroke:#8a6a1f }
    .alt   { fill:#ffffff; stroke:#3f6b8a }
    .seam  { fill:none; stroke:#b8b4ac; stroke-dasharray:6 5 }
    .rule  { fill:none; stroke:#b8b4ac; stroke-width:1 }
    .ln    { fill:none; stroke:#8a6a1f; stroke-width:1.4 }
    .ln2   { fill:none; stroke:#3f6b8a; stroke-width:1.4 }
    .ah    { fill:#8a6a1f }
    .ah2   { fill:#3f6b8a }
    .fill1 { fill:#8a6a1f; opacity:.16 }
    .fill2 { fill:#3f6b8a; opacity:.16 }
    .warn  { fill:none; stroke:#a3401f; stroke-width:1.6 }
    .warnt { fill:#a3401f }
    text   { font-family:Inter,"Helvetica Neue","Hiragino Sans","Noto Sans JP",Arial,sans-serif; fill:#1f2328 }
    .h     { font-size:12.5px }
    .lbl   { font-size:11px; fill:#6e7781; letter-spacing:.06em }
    .s     { font-size:10.5px; fill:#6e7781 }
    .mono  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:10.5px; fill:#8a6a1f }
    @media (prefers-color-scheme: dark) {
      .bg{fill:#0d1117} .grp{fill:#12171d}
      .chip{fill:#161b22;stroke:#30363d} .card{fill:#161b22;stroke:#d9b45c} .alt{fill:#161b22;stroke:#7fb3d5}
      .seam{stroke:#484f58} .rule{stroke:#484f58}
      .ln{stroke:#d9b45c} .ln2{stroke:#7fb3d5} .ah{fill:#d9b45c} .ah2{fill:#7fb3d5}
      .fill1{fill:#d9b45c} .fill2{fill:#7fb3d5}
      .warn{stroke:#e08a68} .warnt{fill:#e08a68} .mono{fill:#d9b45c}
      text{fill:#e6edf3} .lbl{fill:#8b949e} .s{fill:#8b949e}
    }
  </style>

  <rect class="bg" x="0" y="0" width="960" height="386" rx="12"/>

  <rect class="grp" x="24" y="48" width="912" height="130" rx="8"/>
  <text class="lbl" x="38" y="68">one intent per bar span — a fugue, read left to right</text>

  <text class="lbl" x="38" y="102">V1</text>
  <rect class="card" x="70"  y="86" width="170" height="24" rx="4"/>
  <text class="mono" x="80"  y="102">SubjectCarrier</text>
  <rect class="alt"  x="246" y="86" width="144" height="24" rx="4"/>
  <text class="mono" x="256" y="102">Episode</text>
  <rect class="card" x="396" y="86" width="194" height="24" rx="4"/>
  <text class="mono" x="406" y="102">MiddleEntryCarrier</text>
  <rect class="alt"  x="596" y="86" width="134" height="24" rx="4"/>
  <text class="mono" x="606" y="102">Episode</text>
  <rect class="card" x="736" y="86" width="188" height="24" rx="4"/>
  <text class="mono" x="746" y="102">StrettoCarrier</text>

  <text class="lbl" x="38" y="130">V2</text>
  <rect class="card" x="160" y="114" width="170" height="24" rx="4"/>
  <text class="mono" x="170" y="130">AnswerCarrier</text>
  <rect class="card" x="336" y="114" width="172" height="24" rx="4"/>
  <text class="mono" x="346" y="130">CountersubjectCarrier</text>
  <rect class="alt"  x="514" y="114" width="120" height="24" rx="4"/>
  <text class="mono" x="524" y="130">Episode</text>
  <rect class="card" x="640" y="114" width="150" height="24" rx="4"/>
  <text class="mono" x="650" y="130">MiddleEntryCarrier</text>
  <rect class="card" x="796" y="114" width="128" height="24" rx="4"/>
  <text class="mono" x="806" y="130">StrettoCarrier</text>

  <text class="lbl" x="38" y="158">V3</text>
  <rect class="card" x="250" y="142" width="170" height="24" rx="4"/>
  <text class="mono" x="260" y="158">SubjectCarrier</text>
  <rect class="alt"  x="426" y="142" width="134" height="24" rx="4"/>
  <text class="mono" x="436" y="158">Episode</text>
  <rect class="card" x="566" y="142" width="154" height="24" rx="4"/>
  <text class="mono" x="576" y="158">PedalCarrier</text>
  <rect class="card" x="726" y="142" width="198" height="24" rx="4"/>
  <text class="mono" x="736" y="158">CodaCarrier</text>

  <rect class="grp" x="24" y="190" width="912" height="144" rx="8"/>
  <text class="lbl" x="38" y="210">the families those names group into</text>

  <rect class="chip" x="34" y="218" width="214" height="52" rx="6"/>
  <text class="h" x="46" y="236">Fugal entries</text>
  <text class="s" x="46" y="252">subject, answer, and the</text>
  <text class="s" x="46" y="265">recurring companion line</text>

  <rect class="chip" x="260" y="218" width="214" height="52" rx="6"/>
  <text class="h" x="272" y="236">Development</text>
  <text class="s" x="272" y="252">middle entries, stretto,</text>
  <text class="s" x="272" y="265">pedal points, closing material</text>

  <rect class="chip" x="486" y="218" width="214" height="52" rx="6"/>
  <text class="h" x="498" y="236">Episodes</text>
  <text class="s" x="498" y="252">sequential travel material</text>
  <text class="s" x="498" y="265">derived from subject motifs</text>

  <rect class="chip" x="712" y="218" width="214" height="52" rx="6"/>
  <text class="h" x="724" y="236">Fixed lines</text>
  <text class="s" x="724" y="252">grounds and cantus firmus</text>
  <text class="s" x="724" y="265">lines that never change</text>

  <rect class="chip" x="34" y="274" width="214" height="52" rx="6"/>
  <text class="h" x="46" y="292">Figural</text>
  <text class="s" x="46" y="308">continuous idiomatic</text>
  <text class="s" x="46" y="321">figuration and solo writing</text>

  <rect class="chip" x="260" y="274" width="214" height="52" rx="6"/>
  <text class="h" x="272" y="292">Variation</text>
  <text class="s" x="272" y="308">authored variation material,</text>
  <text class="s" x="272" y="321">including three Goldberg lines</text>

  <rect class="chip" x="486" y="274" width="214" height="52" rx="6"/>
  <text class="h" x="498" y="292">Texture</text>
  <text class="s" x="498" y="308">rhythm shapes, declared</text>
  <text class="s" x="498" y="321">non-chord tones, trio lines</text>

  <path class="seam" d="M 24 350 H 936"/>
  <text class="s" x="480" y="370" text-anchor="middle">The engine names 33 intents. What matters is that every bar of every voice carries exactly one, and the validator knows which.</text>
</svg>
